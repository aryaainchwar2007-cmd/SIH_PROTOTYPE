<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <path d="M50 5 L88 20 C88 55 50 92 50 92 C50 92 12 55 12 20 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <!-- GIS Contour Grid lines -->
  <path d="M25 38 Q50 48 75 38" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M22 52 Q50 64 78 52" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Mountain / Terrain Peak -->
  <polygon points="30,68 50,38 70,68" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <polygon points="40,68 50,48 60,68" fill="#0f172a" />
  <!-- Safe Haven Relocation Pin (Green) -->
  <circle cx="50" cy="30" r="7" fill="url(#accentGrad)" stroke="#ecfdf5" stroke-width="2" />
  <circle cx="50" cy="30" r="2.5" fill="#ffffff" />
  <!-- Radiation / Pulse Ring -->
  <circle cx="50" cy="30" r="12" fill="none" stroke="#34d399" stroke-width="1" opacity="0.7" stroke-dasharray="2,2" />
</svg>
